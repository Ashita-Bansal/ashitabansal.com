<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arcade · Ashita Bansal</title>
  <meta name="description" content="Ten tiny browser games built by Ashita Bansal: Snake, a Mario-style runner, Breakout, Pong, Flappy, Cake Stacker, Blocks, 2048, Memory and Whack-a-Bug.">
  <meta name="theme-color" content="#0a0c10">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='16' fill='%230a0c10'/><text x='50%' y='56%' dominant-baseline='middle' text-anchor='middle' font-family='monospace' font-weight='700' font-size='28' fill='%236ee7b7'>ab</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=7">
  <link rel="stylesheet" href="arcade/arcade.css?v=1">
  <script>
    try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <header class="nav scrolled">
    <div class="wrap nav-inner">
      <a href="index.html" class="logo" aria-label="Back to portfolio"><span>ab</span><b>.</b></a>
      <nav class="nav-links arcade-nav" aria-label="Primary">
        <a href="index.html">← Back to portfolio</a>
      </nav>
      <div class="nav-actions">
        <a class="kbd-btn back-mobile" href="index.html" aria-label="Back to portfolio">← Portfolio</a>
        <button id="theme-toggle" class="icon-btn" aria-label="Toggle colour theme">
          <svg class="sun" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="moon" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="wrap arcade">
    <header class="arcade-head">
      <span class="sec-num">arcade</span>
      <h1>Bored? <span class="grad">Play something.</span></h1>
      <p class="lede">Ten tiny games I built from scratch with plain JavaScript and canvas. No libraries, no build step. Best scores are saved in your browser.</p>
    </header>
    <div class="arcade-grid" id="arcade-grid" aria-label="Games"></div>
  </main>

  <footer class="footer">
    <div class="wrap footer-inner">
      <span>© 2026 Ashita Bansal</span>
      <span class="muted">Esc closes a game · P pauses · R restarts</span>
    </div>
  </footer>

  <div class="stage" id="stage" role="dialog" aria-modal="true" aria-labelledby="st-title" hidden>
    <div class="stage-box">
      <header class="stage-bar">
        <div class="st-info">
          <h2 id="st-title"></h2>
          <p id="st-controls"></p>
        </div>
        <div class="st-scores">
          <span><small id="st-score-label">Score</small><b id="st-score">0</b></span>
          <span><small>Best</small><b id="st-best">—</b></span>
        </div>
        <div class="st-actions">
          <button type="button" class="icon-btn" id="st-restart" aria-label="Restart" title="Restart (R)">↻</button>
          <button type="button" class="icon-btn" id="st-close" aria-label="Close game" title="Close (Esc)">✕</button>
        </div>
      </header>
      <div class="screen" id="st-screen">
        <canvas id="st-canvas"></canvas>
        <div class="overlay" id="st-overlay" hidden></div>
      </div>
      <div class="pad" id="st-pad" hidden></div>
    </div>
  </div>

  <script src="arcade/arcade.js?v=2" defer></script>
  <script src="arcade/games/snake.js?v=1" defer></script>
  <script src="arcade/games/runner.js?v=1" defer></script>
  <script src="arcade/games/breakout.js?v=1" defer></script>
  <script src="arcade/games/pong.js?v=1" defer></script>
  <script src="arcade/games/flappy.js?v=1" defer></script>
  <script src="arcade/games/stacker.js?v=1" defer></script>
  <script src="arcade/games/blocks.js?v=1" defer></script>
  <script src="arcade/games/2048.js?v=1" defer></script>
  <script src="arcade/games/memory.js?v=1" defer></script>
  <script src="arcade/games/whack.js?v=1" defer></script>
</body>
</html>
